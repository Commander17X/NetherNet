name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  app-typecheck:
    name: app — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  app-test:
    name: app — jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test

  app-expo-export:
    name: app — expo export
    runs-on: ubuntu-latest
    needs: [app-typecheck, app-test]
    if: hashFiles('app.json', 'app.config.js', 'app.config.ts') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run export
      - uses: actions/upload-artifact@v4
        with:
          name: expo-export
          path: dist/
          if-no-files-found: warn

  relay-typecheck:
    name: relay — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run build

  relay-test:
    name: relay — jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run test:ci